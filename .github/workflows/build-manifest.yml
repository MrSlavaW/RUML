name: Build Translation Packs and Manifest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Packs & Manifest
        run: |
          python .github/scripts/build_packs.py

      - name: Commit and push manifest & packs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json packs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build translation packs and manifest" && git push)